name: CI/CD Deploy na InfinityFree

on:
  push:
    branches: [ "main" ]

jobs:
  # 1. FÁZE CI: Kontrola a testy před nasazením
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Stažení kódu z repozitáře
        uses: actions/checkout@v4

      - name: Spuštění testů / kontrola
        run: |
          echo "Kontroluji soubory před nasazením..."
          # Zde můžete přidat vlastní testy (např. npm test nebo kontrolu PHP syntaxe)

  # 2. FÁZE CD: Nahrání souborů na InfinityFree přes FTP
  deploy:
    needs: test # Spustí se jen tehdy, pokud projde krok "test"
    runs-on: ubuntu-latest
    steps:
      - name: Stažení kódu z repozitáře
        uses: actions/checkout@v4

      - name: Nahrání na InfinityFree přes FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
